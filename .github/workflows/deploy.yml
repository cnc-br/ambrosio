name: Deploy ambrosio

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AppServer
    runs-on: ubuntu-latest
    steps:
      - name: Executar deploy no AppServer
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            /opt/cnc/scripts/deploy-ambrosio.sh
