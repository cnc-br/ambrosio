name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # Necessário para criar tags/releases

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: ⚡️ Instalar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Instalar dependências
        run: npm ci

      - name: Incrementar versão (minor)
        id: version
        run: |
          VERSION=$(npm version minor -m "chore(release): %s 🎉 [nova-versao]")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Push da tag gerada
        run: git push --follow-tags

      - name: Criar release final com changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy no AppServer
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            /opt/cnc/scripts/deploy-ambrosio.sh
